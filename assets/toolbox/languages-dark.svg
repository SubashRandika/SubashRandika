<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 104" width="880" height="104" role="img" aria-label="Languages: JavaScript, TypeScript, HTML5, CSS3, Java">
  <defs>
    <style>@font-face{font-family:'Sora';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
      .l{font:600 24px 'Sora',sans-serif;fill:#f5efe6}
      .bar{fill:#9aa3b8;opacity:.35}
      .tile{transform-box:fill-box;animation:pop .55s cubic-bezier(.3,1.4,.5,1) both}
      @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}}
      @media (prefers-reduced-motion:reduce){.tile{animation:none}}
    </style>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#efe2cf"/></linearGradient>
    <filter id="d" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0b1026" flood-opacity=".5"/></filter>
  </defs>
  <rect class="bar" x="8" y="38" width="6" height="24" rx="3"/>
  <text class="l" x="28" y="58">Languages</text>
