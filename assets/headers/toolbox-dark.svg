<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 100" width="720" height="100" role="img" aria-label="Toolbox">
  <defs>
    <style>@font-face{font-family:'Sora';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
      .t{font:700 38px 'Sora',sans-serif;fill:#f5efe6;letter-spacing:-.5px}
      .s{font:500 18px 'JetBrains Mono',monospace;fill:#9aa3b8}
